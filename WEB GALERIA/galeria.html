<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeria · Bicis Tramuntana</title>
  <link rel="stylesheet" href="css/galeria.css">
</head>
<body>
  <header>
    <h1>Bicis Tramuntana</h1>
    <p class="banner">Lloga la bici per a qualsevol d’aquestes rutes: 15 € el dia</p>
  </header>

  <main>
    <h2>Rutes en bici per Mallorca</h2>
    <div class="galeria">
      <figure>
        <img src="img/sa_calobra.jpg" alt="Carretera de revolts entre penya-segats de la serra de Tramuntana">
        <figcaption>Sa Calobra <span class="km">· 38 km</span></figcaption>
      </figure>

      <figure>
        <img src="img/formentor.jpg" alt="Carretera costanera cap al far del Cap de Formentor amb vistes al mar">
        <figcaption>Cap de Formentor <span class="km">· 42 km</span></figcaption>
      </figure>

      <figure>
        <img src="img/valldemossa.jpg" alt="Poble de muntanya de Valldemossa envoltat de vegetació a la serra">
        <figcaption>Valldemossa <span class="km">· 30 km</span></figcaption>
      </figure>

      <figure>
        <img src="img/port_soller.jpg" alt="Badia circular del Port de Sóller amb barques i muntanyes al fons">
        <figcaption>Port de Sóller <span class="km">· 25 km</span></figcaption>
      </figure>

      <figure>
        <img src="img/ametllers.jpg" alt="Camp ple d'ametllers florits de color blanc i rosat">
        <figcaption>Els ametllers en flor <span class="km">· 35 km</span></figcaption>
      </figure>

      <figure>
        <img src="img/es_trenc.jpg" alt="Platja d'arena blanca i aigua turquesa d'Es Trenc">
        <figcaption>Es Trenc <span class="km">· 28 km</span></figcaption>
      </figure>

      <figure>
        <img src="img/lluc.jpg" alt="Santuari de Lluc envoltat de boscos i muntanyes de la Tramuntana">
        <figcaption>Santuari de Lluc <span class="km">· 45 km</span></figcaption>
      </figure>

      <figure>
        <img src="img/pollenca.jpg" alt="Pont romà de pedra sobre el torrent de Pollença">
        <figcaption>Pont romà de Pollença <span class="km">· 20 km</span></figcaption>
      </figure>

      <figure>
        <img src="img/salines.jpg" alt="Estanys de sal amb reflexos rosats a Ses Salines">
        <figcaption>Ses Salines <span class="km">· 32 km</span></figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
